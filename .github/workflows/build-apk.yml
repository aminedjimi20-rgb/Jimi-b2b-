name: Build APK

# Manual trigger (Actions tab > Build APK > Run workflow) — lets you pass
# your own backend URL at build time instead of the local-dev default.
# Also builds automatically on pushes that touch mobile/, so a build is
# always available after a change without needing to remember to click Run.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL (e.g. https://api.votre-domaine.com/api)"
        required: false
        default: "https://jimi-b2b-production.up.railway.app/api"
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://jimi-b2b-production.up.railway.app/api' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jimi-b2b-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
